# Build the strategy website from the repo and the Modal run logs, and publish it to GitHub Pages.
# Runs after the daily Modal pass (14:00 UTC), on every push to main, and on demand.
#
# Run logs come from the public, read-only `run_logs` endpoint in deploy/modal_app.py, so this
# workflow holds no Modal token. Needs the repo variable RUN_LOGS_URL (the endpoint's URL, printed
# by `modal deploy`), and Settings > Pages > Source set to "GitHub Actions".
name: site

on:
  schedule:
    - cron: "30 15 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Build site
        env:
          PREDMARK_RUN_LOGS_URL: ${{ vars.RUN_LOGS_URL }}
        run: uv run python -m predmark.site --from-url
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
