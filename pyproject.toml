[project]
name = "predmark"
version = "0.1.0"
description = "Automated research and execution for prediction markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "cryptography>=42",
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.scripts]
predmark = "predmark.cli:main"

[dependency-groups]
dev = [
    "defusedxml>=0.7",
    "modal>=1.6.3",
    "pytest>=8",
    "pytest-mock>=3.17.0",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/lit.py is a script, not part of the package. Its tests import it from here.
pythonpath = ["scripts"]
# -ra lists every test that did not pass, with its reason, in the summary.
addopts = "-ra"
# A hung network call or loop fails its test instead of stopping the run.
timeout = 60
# The signal method needs the main thread and does not work on Windows.
timeout_method = "thread"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "D", "ERA"]
# The class docstring covers magic methods and __init__.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A test's name says what it checks.
"tests/**" = ["D1"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["decimal.Decimal"]
