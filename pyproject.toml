[project]
name = "predmark"
version = "0.1.0"
description = "Automated research and execution for prediction markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "cryptography>=42",
  "defusedxml>=0.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6",
]

[project.scripts]
predmark = "predmark.cli:main"

[dependency-groups]
dev = [
    "modal>=1.6.3",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["decimal.Decimal"]
